on: push
name: Publish Website to CPanel
jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v6

    - name: Validate deployment secrets
      shell: bash
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        if [ -z "$FTP_SERVER" ]; then
          echo "FTP_SERVER secret is missing. Set it to your FTP host name only (for example: ftp.yourdomain.com)."
          exit 1
        fi
        if [ -z "$FTP_USERNAME" ]; then
          echo "FTP_USERNAME secret is missing."
          exit 1
        fi
        if [ -z "$FTP_PASSWORD" ]; then
          echo "FTP_PASSWORD secret is missing."
          exit 1
        fi
        if [[ "$FTP_SERVER" == http://* || "$FTP_SERVER" == https://* ]]; then
          echo "FTP_SERVER should be only the host name, not a full URL."
          exit 1
        fi
        echo "Deploying to host: $FTP_SERVER"

    - name: Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server:  ${{ secrets.FTP_SERVER }}
        username:  ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
